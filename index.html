// ---------- 저장소 ----------
const KEY_P = "pc:partners:v2";
const KEY_I = "pc:issues:v2";

function loadKey(key, fallback) {
  try {
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r) : fallback;
  } catch (e) { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}

// ---------- 작은 UI 컴포넌트 ----------
function Pill({ s, map = STATUS, small }) {
  const m = map[s] || STATUS.planned;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      fontFamily: MONO, fontSize: small ? 10 : 11, fontWeight: 600,
      color: m.c, background: m.bg || "transparent",
      padding: small ? "2px 7px" : "3px 9px", borderRadius: 6,
      border: `1px solid ${m.c}33`, letterSpacing: 0.3, whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 99, background: m.c, boxShadow: `0 0 6px ${m.c}` }} />
      {m.ko}
    </span>
  );
}

function Progress({ v, c = C.brand }) {
  return (
    <div style={{ flex: 1, minWidth: 60 }}>
      <div style={{ height: 6, borderRadius: 99, background: "#0e1117", overflow: "hidden", border: `1px solid ${C.borderSoft}` }}>
        <div style={{ width: `${v}%`, height: "100%", background: `linear-gradient(90deg, ${c}, ${c}aa)`, borderRadius: 99, transition: "width .4s cubic-bezier(.2,.8,.2,1)" }} />
      </div>
    </div>
  );
}

function Panel({ children, style }) {
  return (
    <div style={{
      background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14,
      boxShadow: "0 1px 0 rgba(255,255,255,0.02) inset, 0 14px 40px -20px rgba(0,0,0,0.6)",
      ...style,
    }}>{children}</div>
  );
}

// ---------- KPI ----------
function Kpi({ label, value, accent, sub }) {
  return (
    <Panel style={{ padding: "16px 18px", flex: 1, minWidth: 150, position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", inset: 0, background: `linear-gradient(135deg, ${accent}14, transparent 55%)` }} />
      <div style={{ position: "relative" }}>
        <div style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: 1.2, color: C.faint, textTransform: "uppercase" }}>{label}</div>
        <div style={{ fontFamily: MONO, fontSize: 34, fontWeight: 700, color: C.text, marginTop: 6, lineHeight: 1 }}>
          {value}
        </div>
        {sub && <div style={{ fontSize: 12, color: accent, marginTop: 8, fontWeight: 600 }}>{sub}</div>}
        <div style={{ position: "absolute", top: -4, right: -4, width: 30, height: 30, borderRadius: 8, background: accent, opacity: 0.18 }} />
      </div>
    </Panel>
  );
}

    const allItems = vp.flatMap(p => p.items);
    const allMs = allItems.flatMap(i => i.milestones);
    return {
      partners: vp.length,
      activeItems: allItems.filter(i => i.status === "active").length,
      totalItems: allItems.length,
      delayedMs: allMs.filter(m => m.status === "delayed" || m.status === "risk").length,
      doneMs: allMs.filter(m => m.status === "done").length,
      totalMs: allMs.length,
      openIssues: vi.filter(i => i.status !== "resolved").length,
      highIssues: vi.filter(i => i.sev === "high" && i.status !== "resolved").length,
      avgProgress: allItems.length ? Math.round(allItems.reduce((a, i) => a + i.progress, 0) / allItems.length) : 0,
    };

    .filter(m => m.status !== "done")

// ============================================================ 개요
function Overview({ partners, issues, upcoming, stats, onOpen }) {
  const dist = Object.keys(STATUS).map(k => ({
    k, ...STATUS[k],
    n: partners.flatMap(p => p.items).filter(i => i.status === k).length,
  }));
  const totalItems = stats.totalItems || 1;
  const recentIssues = [...issues].filter(i => i.status !== "resolved")
    .sort((a, b) => ({ high: 0, medium: 1, low: 2 }[a.sev] - { high: 0, medium: 1, low: 2 }[b.sev])).slice(0, 5);

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18 }}>
      {/* 진행 상태 분포 */}
      <Panel style={{ padding: 22, gridColumn: "1 / 2" }}>
        <SectionTitle>협력 Item 진행 상태</SectionTitle>
        <div style={{ display: "flex", height: 12, borderRadius: 8, overflow: "hidden", marginTop: 16, border: `1px solid ${C.borderSoft}` }}>
          {dist.filter(d => d.n > 0).map(d => (
            <div key={d.k} title={`${d.ko} ${d.n}`} style={{ width: `${d.n / totalItems * 100}%`, background: d.c }} />
          ))}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginTop: 16 }}>
          {dist.map(d => (
            <div key={d.k} style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <span style={{ width: 9, height: 9, borderRadius: 3, background: d.c }} />
              <span style={{ fontSize: 13, color: C.sub }}>{d.ko}</span>
              <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, color: C.text }}>{d.n}</span>
            </div>
          ))}
        </div>

        <SectionTitle style={{ marginTop: 28 }}>카테고리 · 파트너사별 진척</SectionTitle>
        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 16 }}>
          {GROUP_ORDER.map(g => {
            const list = partners.filter(p => p.group === g);
            if (!list.length) return null;
            const meta = GROUP_META[g];
            return (
              <div key={g}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: meta.c }} />
                  <span style={{ fontFamily: MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: meta.c }}>{meta.label}</span>
                  <div style={{ flex: 1, height: 1, background: C.borderSoft }} />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {list.map(p => {
                    const avg = Math.round(p.items.reduce((a, i) => a + i.progress, 0) / p.items.length);
                    return (
                      <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 14 }}>
                        <div style={{ width: 120, flexShrink: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 700 }}>{p.name}</div>
                          <div style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint }}>{p.tier}</div>
                        </div>
                        <Progress v={avg} c={STATUS[p.health].c} />
                        <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, width: 42, textAlign: "right", color: STATUS[p.health].c }}>{avg}%</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </Panel>

      {/* 다가오는 마일스톤 */}
      <Panel style={{ padding: 22 }}>
        <SectionTitle>다가오는 마일스톤</SectionTitle>
        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 2 }}>
          {upcoming.map(m => (
            <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: `1px solid ${C.borderSoft}` }}>
              <div style={{ fontFamily: MONO, fontSize: 11, color: C.brand, width: 64, flexShrink: 0 }}>{m.date.slice(5)}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.title}</div>
                <div style={{ fontSize: 11, color: C.faint }}>{m.partner}</div>
              </div>
              <Pill s={m.status} small />
            </div>
          ))}
        </div>
      </Panel>

      {/* 주요 이슈 */}
      <Panel style={{ padding: 22, gridColumn: "1 / 3" }}>
        <SectionTitle>우선 대응 이슈</SectionTitle>
        <div style={{ marginTop: 12 }}>
          {recentIssues.map(it => (
            <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 0", borderBottom: `1px solid ${C.borderSoft}` }}>
              <span style={{ width: 8, height: 8, borderRadius: 99, background: SEV[it.sev].c, flexShrink: 0, boxShadow: `0 0 8px ${SEV[it.sev].c}` }} />

}

// ============================================================ 파트너 / Item
function Partners({ partners, onOpen }) {
  const order = ["OTT", "Game", "Music", "AI"];
  const groups = order
    .map(g => ({ g, list: partners.filter(p => (p.group || "기타") === g) }))
    .filter(x => x.list.length > 0);
  // 그룹 미지정 파트너 보강
  const ungrouped = partners.filter(p => !order.includes(p.group));
  if (ungrouped.length) groups.push({ g: "기타", list: ungrouped });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 30 }}>
      {groups.map(({ g, list }) => {
        const meta = GROUP_META[g] || { label: g, c: C.faint };
        return (
          <div key={g}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: meta.c, boxShadow: `0 0 10px ${meta.c}` }} />
              <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, letterSpacing: 1.5, color: C.text }}>{meta.label}</span>
              <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>{list.length} 파트너</span>
              <div style={{ flex: 1, height: 1, background: C.border }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(330px, 1fr))", gap: 18 }}>
              {list.map(p => <PartnerCard key={p.id} p={p} accent={meta.c} onOpen={onOpen} />)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================ Item 상세 드로어

  const p = partners.find(x => x.id === sel.partnerId);
  const it = p?.items.find(x => x.id === sel.itemId);
  if (!it) return null;
  const linked = issues.filter(i => i.partner === p.name && i.item === it.title);

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(4,6,10,0.6)", backdropFilter: "blur(3px)", zIndex: 50, display: "flex", justifyContent: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: "min(560px, 100%)", height: "100%", background: C.panel, borderLeft: `1px solid ${C.border}`,
        overflowY: "auto", animation: "slideIn .28s cubic-bezier(.2,.8,.2,1)",
      }}>
        <div style={{ padding: "22px 24px", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, background: C.panel, zIndex: 2 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
            <div>
              <div style={{ fontFamily: MONO, fontSize: 11, color: C.brand, letterSpacing: 0.5 }}>{p.name} · {p.category}</div>
              <div style={{ fontSize: 19, fontWeight: 800, marginTop: 5 }}>{it.title}</div>
            </div>
            <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border}`, color: C.sub, width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 16, flexShrink: 0 }}>✕</button>
          </div>
        </div>

        <div style={{ padding: 24 }}>
          {/* 상태 + 진척 편집 */}
          <SectionTitle>상태 / 진척 관리</SectionTitle>
          <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
            {Object.keys(STATUS).map(s => (
              <button key={s} onClick={() => setItemStatus(p.id, it.id, s)} style={{
                cursor: "pointer", padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 600,
                fontFamily: MONO, background: it.status === s ? STATUS[s].bg : "transparent",

            <span style={{ fontFamily: MONO, fontSize: 20, fontWeight: 700, color: C.brand, width: 58, textAlign: "right" }}>{it.progress}%</span>
          </div>

          {/* 마일스톤 타임라인 */}
          <SectionTitle style={{ marginTop: 30 }}>마일스톤</SectionTitle>
          <div style={{ marginTop: 16, position: "relative", paddingLeft: 6 }}>
            <div style={{ position: "absolute", left: 12, top: 4, bottom: 4, width: 2, background: C.border }} />
            {it.milestones.map((m, idx) => (
              <div key={m.id} style={{ position: "relative", paddingLeft: 32, paddingBottom: idx === it.milestones.length - 1 ? 0 : 20 }}>
                <span style={{ position: "absolute", left: 5, top: 2, width: 16, height: 16, borderRadius: 99, background: C.panel, border: `2px solid ${STATUS[m.status].c}`, boxShadow: m.status === "done" ? `0 0 0 3px ${STATUS[m.status].bg}` : "none", display: "flex", alignItems: "center", justifyContent: "center" }}>

                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                  {Object.keys(STATUS).map(s => (
                    <button key={s} onClick={() => setMilestoneStatus(p.id, it.id, m.id, s)} style={{
                      cursor: "pointer", padding: "3px 9px", borderRadius: 6, fontSize: 10.5, fontFamily: MONO, fontWeight: 600,
                      background: m.status === s ? STATUS[s].bg : "transparent",

                    }}>{STATUS[s].ko}</button>

                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, alignItems: "center" }}>
                  <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>담당 {i.owner} · ~{i.due}</span>
                  <Pill s={i.status} map={ISSUE_STATUS} small />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================ 이슈 트래커
function Issues({ issues, setIssues, filter, setFilter, showAdd, setShowAdd, partners, catByName = {} }) {
  const filtered = filter === "all" ? issues : issues.filter(i => i.status === filter);
  const order = { open: 0, in_progress: 1, resolved: 2 };
  const sorted = [...filtered].sort((a, b) => order[a.status] - order[b.status] || ({ high: 0, medium: 1, low: 2 }[a.sev] - { high: 0, medium: 1, low: 2 }[b.sev]));

  const cycle = (id) => setIssues(prev => prev.map(i => {
    if (i.id !== id) return i;
    const next = i.status === "open" ? "in_progress" : i.status === "in_progress" ? "resolved" : "open";
    return { ...i, status: next };
  }));
  const remove = (id) => setIssues(prev => prev.filter(i => i.id !== id));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", gap: 6 }}>
          {[["all", "전체"], ["open", "Open"], ["in_progress", "In Progress"], ["resolved", "Resolved"]].map(([v, l]) => (
            <button key={v} onClick={() => setFilter(v)} style={{
              cursor: "pointer", padding: "7px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, fontFamily: MONO,
              background: filter === v ? C.brandDim : "transparent",
              border: `1px solid ${filter === v ? C.brand : C.border}`,
              color: filter === v ? C.brand : C.faint,
            }}>{l}</button>
          ))}
        </div>
        <button onClick={() => setShowAdd(true)} style={{ cursor: "pointer", padding: "8px 16px", borderRadius: 8, fontSize: 13, fontWeight: 700, background: C.brand, border: "none", color: "#06120f" }}>+ 이슈 등록</button>
      </div>

      <Panel style={{ overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "16px 1fr 130px 70px 90px 100px 40px", gap: 12, padding: "12px 18px", borderBottom: `1px solid ${C.border}`, fontFamily: MONO, fontSize: 10.5, color: C.faint, textTransform: "uppercase", letterSpacing: 0.5, alignItems: "center" }}>
          <span></span><span>이슈</span><span>파트너</span><span>심각도</span><span>마감</span><span>상태</span><span></span>
        </div>
        {sorted.map(i => (
          <div key={i.id} style={{ display: "grid", gridTemplateColumns: "16px 1fr 130px 70px 90px 100px 40px", gap: 12, padding: "14px 18px", borderBottom: `1px solid ${C.borderSoft}`, alignItems: "center" }}>
            <span style={{ width: 9, height: 9, borderRadius: 99, background: SEV[i.sev].c, boxShadow: `0 0 7px ${SEV[i.sev].c}` }} />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600 }}>{i.title}</div>
              <div style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint, marginTop: 2 }}>{i.item} · 담당 {i.owner}</div>
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12.5, color: C.sub, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{i.partner}</div>
              {catByName[i.partner] && GROUP_META[catByName[i.partner]] && (
                <span style={{ fontFamily: MONO, fontSize: 9.5, fontWeight: 700, letterSpacing: 0.5, color: GROUP_META[catByName[i.partner]].c }}>
                  {GROUP_META[catByName[i.partner]].label}
                </span>
              )}
            </div>
            <span style={{ fontFamily: MONO, fontSize: 11.5, fontWeight: 700, color: SEV[i.sev].c }}>{SEV[i.sev].ko}</span>
            <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.faint }}>{i.due.slice(5)}</span>
            <button onClick={() => cycle(i.id)} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, textAlign: "left" }} title="클릭하여 상태 변경">
              <Pill s={i.status} map={ISSUE_STATUS} small />
            </button>
            <button onClick={() => remove(i.id)} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", fontSize: 14 }} title="삭제">✕</button>
          </div>
        ))}
        {sorted.length === 0 && <div style={{ padding: 30, textAlign: "center", color: C.faint, fontSize: 13 }}>해당 조건의 이슈가 없습니다.</div>}
      </Panel>

      {showAdd && <AddIssue partners={partners} onClose={() => setShowAdd(false)} onAdd={(issue) => { setIssues(prev => [{ ...issue, id: "is" + Date.now() }, ...prev]); setShowAdd(false); }} />}
    </div>
  );
}

function AddIssue({ partners, onClose, onAdd }) {
  const [f, setF] = useState({ partner: partners[0].name, item: partners[0].items[0].title, title: "", sev: "medium", owner: "", due: "" });
  const curItems = partners.find(p => p.name === f.partner)?.items || [];
  const inputS = { width: "100%", background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 13, fontFamily: SANS, boxSizing: "border-box" };
  const lbl = { fontFamily: MONO, fontSize: 10.5, color: C.faint, textTransform: "uppercase", letterSpacing: 0.5, display: "block", marginBottom: 6 };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(4,6,10,0.6)", backdropFilter: "blur(3px)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <Panel style={{ width: "min(460px, 100%)", padding: 26 }} >
        <div onClick={e => e.stopPropagation()}>
          <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 20 }}>이슈 등록</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div>
              <label style={lbl}>이슈 내용</label>
              <input style={inputS} value={f.title} placeholder="예: 특정 모델에서 HDR 메타데이터 누락" onChange={e => setF({ ...f, title: e.target.value })} />
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <label style={lbl}>파트너</label>
                <select style={inputS} value={f.partner} onChange={e => { const np = partners.find(p => p.name === e.target.value); setF({ ...f, partner: e.target.value, item: np.items[0].title }); }}>
                  {partners.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                </select>
              </div>
              <div style={{ flex: 1 }}>
                <label style={lbl}>심각도</label>
                <select style={inputS} value={f.sev} onChange={e => setF({ ...f, sev: e.target.value })}>
                  <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
                </select>
              </div>
            </div>
            <div>
              <label style={lbl}>협력 Item</label>
              <select style={inputS} value={f.item} onChange={e => setF({ ...f, item: e.target.value })}>
                {curItems.map(it => <option key={it.id} value={it.title}>{it.title}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <label style={lbl}>담당자</label>
                <input style={inputS} value={f.owner} placeholder="이름" onChange={e => setF({ ...f, owner: e.target.value })} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={lbl}>마감일</label>
                <input style={inputS} type="date" value={f.due} onChange={e => setF({ ...f, due: e.target.value })} />
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
            <button onClick={onClose} style={{ cursor: "pointer", padding: "9px 16px", borderRadius: 8, background: "transparent", border: `1px solid ${C.border}`, color: C.sub, fontSize: 13, fontWeight: 600 }}>취소</button>
            <button onClick={() => f.title && f.owner && f.due && onAdd({ ...f, status: "open" })} style={{ cursor: "pointer", padding: "9px 18px", borderRadius: 8, background: C.brand, border: "none", color: "#06120f", fontSize: 13, fontWeight: 700, opacity: (f.title && f.owner && f.due) ? 1 : 0.5 }}>등록</button>
          </div>
        </div>
      </Panel>
    </div>
  );
}

// ============================================================ 마일스톤 타임라인
function Timeline({ partners }) {
  const months = ["2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"];
  const monthIdx = (d) => months.indexOf(d.slice(0, 7));
  const grid = `220px repeat(${months.length}, 1fr)`;
  const groups = GROUP_ORDER
    .map(g => ({ g, meta: GROUP_META[g], rows: partners.filter(p => p.group === g).flatMap(p => p.items.map(it => ({ partner: p.name, ...it }))) }))
    .filter(x => x.rows.length > 0);

  return (
    <Panel style={{ padding: 22, overflowX: "auto" }}>
      <SectionTitle>카테고리별 마일스톤 타임라인 (2026)</SectionTitle>
      <div style={{ minWidth: 760, marginTop: 18 }}>
        {/* 월 헤더 */}
        <div style={{ display: "grid", gridTemplateColumns: grid, borderBottom: `1px solid ${C.border}`, paddingBottom: 8 }}>
          <span />
          {months.map(m => <span key={m} style={{ fontFamily: MONO, fontSize: 11, color: C.faint, textAlign: "center" }}>{m.slice(5)}월</span>)}
        </div>

        {groups.map(({ g, meta, rows }) => (
          <div key={g}>
            {/* 카테고리 밴드 */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 0 6px" }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: meta.c, boxShadow: `0 0 8px ${meta.c}` }} />
              <span style={{ fontFamily: MONO, fontSize: 11.5, fontWeight: 700, letterSpacing: 1.2, color: meta.c }}>{meta.label}</span>
              <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint }}>{rows.length} item</span>
              <div style={{ flex: 1, height: 1, background: C.borderSoft }} />
            </div>
            {rows.map((r, ri) => (
              <div key={ri} style={{ display: "grid", gridTemplateColumns: grid, alignItems: "center", padding: "14px 0", borderBottom: `1px solid ${C.borderSoft}`, position: "relative" }}>
                <div style={{ paddingRight: 12 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.title}</div>
                  <div style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint }}>{r.partner}</div>
                </div>
                {months.map((m, mi) => (
                  <div key={mi} style={{ position: "relative", height: 30, borderLeft: `1px dashed ${C.borderSoft}` }} />
                ))}
                {r.milestones.map(ms => {
                  const idx = monthIdx(ms.date);
                  if (idx < 0) return null;
                  const day = Number(ms.date.slice(8, 10));
                  const left = `calc(220px + (${idx} + ${day / 31}) * ((100% - 220px) / ${months.length}))`;
                  return (
                    <div key={ms.id} title={`${ms.title} (${ms.date})`} style={{
                      position: "absolute", left, top: "50%", transform: "translate(-50%,-50%)",
                      width: 14, height: 14, borderRadius: 99, background: STATUS[ms.status].c,
                      border: `2px solid ${C.panel}`, boxShadow: `0 0 8px ${STATUS[ms.status].c}aa`, cursor: "pointer", zIndex: 2,
                    }} />
                  );
                })}
              </div>
            ))}
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 16, marginTop: 18, flexWrap: "wrap" }}>
        {Object.keys(STATUS).map(k => (
          <div key={k} style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <span style={{ width: 10, height: 10, borderRadius: 99, background: STATUS[k].c }} />
            <span style={{ fontSize: 12, color: C.sub }}>{STATUS[k].ko}</span>
          </div>
        ))}
      </div>
    </Panel>
  );
}

// ---------- 공통 ----------
function SectionTitle({ children, style }) {
  return <div style={{ fontFamily: MONO, fontSize: 11.5, fontWeight: 700, letterSpacing: 1, color: C.sub, textTransform: "uppercase", ...style }}>{children}</div>;
}

function FontStyles() {
  return (
    <style>{`
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: ${C.bg}; }
      ::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 6px; }
      @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      input[type=range] { height: 4px; border-radius: 4px; }
      select option { background: ${C.panel2}; }
    `}</style>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
